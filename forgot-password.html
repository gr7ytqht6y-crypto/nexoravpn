<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7fafc">

  <title>Восстановление пароля — NexoraVPN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #1769ff;
      --blue-dark: #0f56d9;
      --green: #2FCE2C;
      --green-hover: #42D83F;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f7fafc;
      --white: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top right,
          rgba(23, 105, 255, 0.09),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(47, 206, 44, 0.06),
          transparent 32%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    /* LOGO */

    .logo {
      text-align: center;

      margin-bottom: 26px;

      color: var(--text);

      font-size: 26px;
      font-weight: 800;

      letter-spacing: -0.8px;
    }

    .logo span {
      color: var(--blue);
    }

    /* CARD */

    .card {
      position: relative;
      overflow: hidden;

      padding: 32px;

      background: rgba(255, 255, 255, 0.96);

      border: 1px solid var(--border);
      border-radius: 22px;

      box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.08);
    }

    .card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 15%;
      right: 15%;

      height: 2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--blue),
          transparent
        );

      opacity: 0.8;
    }

    /* ICON */

    .icon {
      width: 54px;
      height: 54px;

      margin-bottom: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: rgba(23, 105, 255, 0.08);

      border: 1px solid rgba(23, 105, 255, 0.14);

      font-size: 24px;
    }

    /* TITLE */

    h1 {
      margin: 0 0 10px;

      color: var(--text);

      font-size: 29px;
      line-height: 1.15;

      letter-spacing: -0.8px;
    }

    .description {
      margin: 0 0 28px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.6;
    }

    /* FORM */

    label {
      display: block;

      margin-bottom: 9px;

      color: #374151;

      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;

      height: 52px;

      padding: 0 15px;

      border-radius: 13px;

      border: 1px solid var(--border);

      background: var(--white);
      color: var(--text);

      font-family: inherit;
      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #9ca3af;
    }

    input:focus {
      border-color: var(--blue);

      box-shadow:
        0 0 0 3px rgba(23, 105, 255, 0.1);
    }

    /* BUTTON */

    button {
      width: 100%;

      height: 52px;

      margin-top: 16px;

      border: none;
      border-radius: 14px;

      background: var(--green);
      color: white;

      font-family: inherit;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(47, 206, 44, 0.2);

      transition:
        transform 0.15s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--green-hover);

      box-shadow:
        0 10px 24px rgba(47, 206, 44, 0.25);

      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* SUCCESS */

    .success-message {
      padding: 16px;

      border-radius: 13px;

      background: #f0fdf4;

      border: 1px solid #bbf7d0;

      color: #15803d;

      font-size: 14px;
      line-height: 1.55;
    }

    /* ERROR */

    .error-message {
      margin-top: 14px;

      padding: 13px 14px;

      border-radius: 13px;

      background: #fef2f2;

      border: 1px solid #fecaca;

      color: #dc2626;

      font-size: 14px;
      line-height: 1.45;

      text-align: center;
    }

    /* BACK */

    .back {
      display: block;

      margin-top: 22px;

      color: #8b95a3;

      font-size: 13px;

      text-align: center;
      text-decoration: none;

      transition: color 0.2s ease;
    }

    .back:hover {
      color: var(--blue);
    }

    /* FOOTER */

    .footer {
      margin-top: 20px;

      text-align: center;

      color: #9ca3af;

      font-size: 11px;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      body {
        padding: 16px;
      }

      .card {
        padding: 27px 22px;
        border-radius: 19px;
      }

      h1 {
        font-size: 26px;
      }

      .logo {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <span>Nexora</span>VPN
    </div>

    <div class="card">

      <div class="icon">
        🔐
      </div>

      <h1>
        Забыли пароль?
      </h1>

      <p class="description">
        Введите email, который использовали
        при регистрации. Мы отправим инструкции
        для восстановления доступа.
      </p>

      <form id="forgotForm">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <button
          id="submitButton"
          type="submit"
        >
          Восстановить пароль
        </button>

      </form>

      <a
        href="login.html"
        class="back"
      >
        ← Вернуться ко входу
      </a>

    </div>

    <div class="footer">
      NexoraVPN — Интернет. Без границ.
    </div>

  </div>


  <script>

    const form =
      document.getElementById("forgotForm");

    const button =
      document.getElementById("submitButton");


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        button.disabled = true;

        button.textContent =
          "Отправляем...";


        /* Удаляем старое сообщение */

        const oldMessage =
          document.querySelector(
            ".error-message"
          );

        if (oldMessage) {
          oldMessage.remove();
        }


        try {

          const response =
            await fetch(
              "/api/forgot-password",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error ||
              "Ошибка"
            );

          }


          form.innerHTML = `

            <div class="success-message">

              Если аккаунт с этим email
              существует, инструкции по
              восстановлению пароля будут
              отправлены на него.

            </div>

          `;


        } catch (error) {

          const errorMessage =
            document.createElement("div");

          errorMessage.className =
            "error-message";

          errorMessage.textContent =
            "Не удалось отправить запрос. Попробуйте ещё раз.";


          form.appendChild(
            errorMessage
          );


          button.disabled = false;

          button.textContent =
            "Восстановить пароль";

        }

      }
    );

  </script>

</body>
</html>
