<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Восстановление пароля — NexoraVPN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(229, 9, 20, 0.14), transparent 35%),
        #050505;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 26px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .logo span {
      color: #ff3030;
    }

    .card {
      position: relative;
      overflow: hidden;

      background: rgba(16, 16, 16, 0.92);
      border: 1px solid #252525;
      border-radius: 22px;

      padding: 34px;

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.65),
        0 0 50px rgba(229, 9, 20, 0.06);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        #ff3030,
        transparent
      );

      opacity: 0.8;
    }

    .icon {
      width: 54px;
      height: 54px;

      margin-bottom: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: rgba(229, 9, 20, 0.1);
      border: 1px solid rgba(255, 48, 48, 0.2);

      color: #ff3030;
      font-size: 24px;
    }

    h1 {
      margin: 0 0 10px;

      font-size: 29px;
      line-height: 1.15;
      letter-spacing: -0.8px;
    }

    .description {
      margin: 0 0 28px;

      color: #929292;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;

      margin-bottom: 9px;

      color: #ddd;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border-radius: 11px;
      border: 1px solid #2d2d2d;

      background: #080808;
      color: #fff;

      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #555;
    }

    input:focus {
      border-color: #e50914;

      box-shadow:
        0 0 0 3px rgba(229, 9, 20, 0.1);
    }

    button {
      width: 100%;

      margin-top: 16px;

      padding: 14px;

      border: none;
      border-radius: 11px;

      background: #e50914;
      color: #fff;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    button:hover {
      background: #ff202b;

      box-shadow:
        0 8px 25px rgba(229, 9, 20, 0.25);
    }

    button:active {
      transform: scale(0.98);
    }

    .back {
      display: block;

      margin-top: 22px;

      text-align: center;

      color: #888;

      font-size: 13px;
      text-decoration: none;

      transition: color 0.2s ease;
    }

    .back:hover {
      color: #fff;
    }

    .footer {
      margin-top: 20px;

      text-align: center;

      color: #444;

      font-size: 11px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 27px 22px;
        border-radius: 19px;
      }

      h1 {
        font-size: 26px;
      }

      .logo {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Nexora<span>VPN</span>
    </div>

    <div class="card">

      <div class="icon">
        🔐
      </div>

      <h1>Забыли пароль?</h1>

      <p class="description">
        Введите email, который использовали при регистрации.
        Мы отправим инструкции для восстановления доступа.
      </p>

      <form id="forgotForm">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <button type="submit">
          Восстановить пароль
        </button>

      </form>

      <a href="/login.html" class="back">
        ← Вернуться ко входу
      </a>

    </div>

    <div class="footer">
      NexoraVPN — Интернет. Без границ.
    </div>

  </div>
<script>
  const form = document.getElementById("forgotForm");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    const button = form.querySelector("button");
    button.disabled = true;
    button.textContent = "Отправляем...";

    try {
      const response = await fetch("/api/forgot-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Ошибка");
      }

      form.innerHTML = `
        <div style="
          padding: 16px;
          border-radius: 12px;
          background: rgba(40, 180, 90, 0.08);
          border: 1px solid rgba(40, 180, 90, 0.2);
          color: #b8f5ca;
          font-size: 14px;
          line-height: 1.5;
        ">
          Если аккаунт с этим email существует,
          инструкции по восстановлению пароля будут отправлены на него.
        </div>
      `;

    } catch (error) {
      button.disabled = false;
      button.textContent = "Восстановить пароль";

      alert("Не удалось отправить запрос. Попробуйте ещё раз.");
    }
  });
</script>
</body>
</html>
