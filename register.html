<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7fafc">

  <title>Регистрация — NexoraVPN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #1769ff;
      --blue-dark: #0f56d9;
      --green: #2FCE2C;
      --green-hover: #42D83F;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f7fafc;
      --white: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top right,
          rgba(23, 105, 255, 0.09),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(47, 206, 44, 0.06),
          transparent 32%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
    }

    /* CARD */

    .card {
      width: 100%;
      max-width: 420px;

      padding: 32px;

      border-radius: 24px;

      background: rgba(255, 255, 255, 0.96);

      border: 1px solid var(--border);

      box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.08);
    }

    /* LOGO */

    .logo {
      text-align: center;

      margin-bottom: 30px;

      color: var(--text);

      font-size: 22px;
      font-weight: 800;

      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--blue);
    }

    /* TITLE */

    h1 {
      margin: 0 0 10px;

      color: var(--text);

      font-size: 28px;
      line-height: 1.2;

      letter-spacing: -0.5px;

      text-align: center;
    }

    .subtitle {
      margin: 0 0 25px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.55;

      text-align: center;
    }

    /* FORM */

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      height: 52px;

      padding: 0 16px;

      border-radius: 14px;

      border: 1px solid var(--border);

      background: var(--white);
      color: var(--text);

      font-family: inherit;
      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #9ca3af;
    }

    input:focus {
      border-color: var(--blue);

      box-shadow:
        0 0 0 3px rgba(23, 105, 255, 0.1);
    }

    /* BUTTON */

    button {
      width: 100%;
      height: 52px;

      margin-top: 2px;

      border: 0;
      border-radius: 14px;

      background: var(--green);
      color: white;

      font-family: inherit;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(47, 206, 44, 0.2);

      transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--green-hover);

      transform: translateY(-1px);

      box-shadow:
        0 10px 24px rgba(47, 206, 44, 0.25);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* MESSAGE */

    .message {
      display: none;

      margin-top: 16px;

      padding: 13px 14px;

      border-radius: 13px;

      font-size: 14px;
      line-height: 1.45;

      text-align: center;
    }

    .message.error {
      display: block;

      background: #fef2f2;

      border: 1px solid #fecaca;

      color: #dc2626;
    }

    .message.success {
      display: block;

      background: #f0fdf4;

      border: 1px solid #bbf7d0;

      color: #16a34a;
    }

    /* LOGIN */

    .login {
      margin-top: 23px;

      color: #7b8492;

      font-size: 14px;

      text-align: center;
    }

    .login a {
      color: var(--blue);

      font-weight: 600;

      text-decoration: none;
    }

    .login a:hover {
      color: var(--blue-dark);
    }

    /* BACK */

    .back {
      display: block;

      margin-top: 24px;

      color: #9ca3af;

      font-size: 13px;

      text-align: center;
      text-decoration: none;

      transition: 0.2s ease;
    }

    .back:hover {
      color: var(--blue);
    }

    /* MOBILE */

    @media (max-width: 480px) {

      body {
        padding: 16px;
      }

      .card {
        padding: 26px 20px;

        border-radius: 21px;
      }

      .logo {
        margin-bottom: 27px;
      }

      h1 {
        font-size: 26px;
      }

      .subtitle {
        font-size: 13.5px;
        margin-bottom: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      <span>N</span> NexoraVPN
    </div>

    <h1>
      Создать аккаунт
    </h1>

    <p class="subtitle">
      Создай аккаунт NexoraVPN,
      чтобы управлять подпиской и VPN-доступом.
    </p>

    <form id="register-form">

      <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Пароль (минимум 8 символов)"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <input
        id="confirm-password"
        type="password"
        placeholder="Повтори пароль"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button
        id="submit-button"
        type="submit"
      >
        Создать аккаунт
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <div class="login">

      Уже есть аккаунт?

      <a href="login.html">
        Войти
      </a>

    </div>

    <a
      href="index.html"
      class="back"
    >
      ← На главную
    </a>

  </div>


  <script>

    const form =
      document.getElementById("register-form");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("submit-button");


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const confirmPassword =
          document
            .getElementById("confirm-password")
            .value;


        message.className =
          "message";

        message.textContent =
          "";


        /* Проверка паролей */

        if (
          password !==
          confirmPassword
        ) {

          message.textContent =
            "Пароли не совпадают";

          message.classList
            .add("error");

          return;

        }


        /* Проверка длины */

        if (
          password.length < 8
        ) {

          message.textContent =
            "Пароль должен содержать минимум 8 символов";

          message.classList
            .add("error");

          return;

        }


        button.disabled = true;

        button.textContent =
          "Создание...";


        try {

          const response =
            await fetch(
              "/api/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email,
                  password
                })
              }
            );


          const result =
            await response.json();


          if (result.success) {

            message.textContent =
              "Аккаунт успешно создан!";

            message.classList
              .add("success");


            form.reset();


          } else {

            message.textContent =
              result.error ||
              "Не удалось создать аккаунт";

            message.classList
              .add("error");

          }


        } catch (error) {

          message.textContent =
            "Ошибка соединения. Попробуйте ещё раз.";

          message.classList
            .add("error");


        } finally {

          button.disabled = false;

          button.textContent =
            "Создать аккаунт";

        }

      }
    );

  </script>

</body>
</html>
