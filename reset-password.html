<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Новый пароль — NexoraVPN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(229, 9, 20, 0.14),
          transparent 35%
        ),
        #050505;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      margin-bottom: 26px;

      text-align: center;

      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .logo span {
      color: #ff3030;
    }

    .card {
      position: relative;
      overflow: hidden;

      padding: 34px;

      background: rgba(16, 16, 16, 0.94);

      border: 1px solid #252525;
      border-radius: 22px;

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.65),
        0 0 50px rgba(229, 9, 20, 0.06);
    }

    .card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 15%;
      right: 15%;

      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        #ff3030,
        transparent
      );
    }

    .icon {
      width: 54px;
      height: 54px;

      margin-bottom: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: rgba(229, 9, 20, 0.1);
      border: 1px solid rgba(255, 48, 48, 0.2);

      color: #ff3030;

      font-size: 24px;
    }

    h1 {
      margin: 0 0 10px;

      font-size: 29px;
      line-height: 1.15;

      letter-spacing: -0.8px;
    }

    .description {
      margin: 0 0 28px;

      color: #929292;

      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;

      margin-bottom: 9px;

      color: #ddd;

      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 14px 15px;
      margin-bottom: 16px;

      border-radius: 11px;
      border: 1px solid #2d2d2d;

      background: #080808;
      color: #fff;

      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #555;
    }

    input:focus {
      border-color: #e50914;

      box-shadow:
        0 0 0 3px rgba(229, 9, 20, 0.1);
    }

    button {
      width: 100%;

      margin-top: 2px;

      padding: 14px;

      border: none;
      border-radius: 11px;

      background: #e50914;

      color: #fff;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    button:hover {
      background: #ff202b;

      box-shadow:
        0 8px 25px rgba(229, 9, 20, 0.25);
    }

    button:active {
      transform: scale(0.98);
    }

    .back {
      display: block;

      margin-top: 22px;

      text-align: center;

      color: #888;

      font-size: 13px;

      text-decoration: none;
    }

    .back:hover {
      color: #fff;
    }

    .footer {
      margin-top: 20px;

      text-align: center;

      color: #444;

      font-size: 11px;
    }

    .message {
      margin-top: 16px;

      padding: 12px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.5;

      display: none;
    }

    .error {
      display: block;

      background: rgba(229, 9, 20, 0.08);

      border: 1px solid rgba(229, 9, 20, 0.2);

      color: #ff8585;
    }

    .success {
      display: block;

      background: rgba(40, 180, 90, 0.08);

      border: 1px solid rgba(40, 180, 90, 0.2);

      color: #b8f5ca;
    }

    @media (max-width: 480px) {
      .card {
        padding: 27px 22px;
        border-radius: 19px;
      }

      h1 {
        font-size: 26px;
      }

      .logo {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Nexora<span>VPN</span>
    </div>

    <div class="card">

      <div class="icon">
        🔑
      </div>

      <h1>Новый пароль</h1>

      <p class="description">
        Придумайте новый пароль для вашего аккаунта NexoraVPN.
      </p>

      <form id="resetForm">

        <label for="password">
          Новый пароль
        </label>

        <input
          type="password"
          id="password"
          placeholder="Введите новый пароль"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <label for="passwordConfirm">
          Повторите пароль
        </label>

        <input
          type="password"
          id="passwordConfirm"
          placeholder="Повторите новый пароль"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button type="submit">
          Изменить пароль
        </button>

        <div id="message" class="message"></div>

      </form>

      <a href="/login.html" class="back">
        ← Вернуться ко входу
      </a>

    </div>

    <div class="footer">
      NexoraVPN — Интернет. Без границ.
    </div>

  </div>

</body>
</html>
