<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Новый пароль — NexoraVPN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #f7fafc;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(23, 105, 255, 0.10),
          transparent 38%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(47, 206, 44, 0.06),
          transparent 30%
        ),
        #f7fafc;

      color: #101828;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 430px;

      animation: appear 0.55s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       LOGO
       ========================= */

    .logo {
      margin-bottom: 24px;

      text-align: center;

      font-size: 27px;
      font-weight: 800;
      letter-spacing: -1px;

      color: #101828;

      user-select: none;
    }

    .logo span {
      color: #1769ff;
    }

    /* =========================
       CARD
       ========================= */

    .card {
      position: relative;
      overflow: hidden;

      padding: 34px;

      background: rgba(255, 255, 255, 0.96);

      border: 1px solid #e4eaf2;
      border-radius: 24px;

      box-shadow:
        0 24px 70px rgba(16, 24, 40, 0.09),
        0 4px 16px rgba(16, 24, 40, 0.04);
    }

    .card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 12%;
      right: 12%;

      height: 2px;

      background: linear-gradient(
        90deg,
        transparent,
        #1769ff,
        #2FCE2C,
        transparent
      );
    }

    .card::after {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      top: -100px;
      right: -80px;

      background: rgba(23, 105, 255, 0.07);

      filter: blur(50px);

      pointer-events: none;
    }

    /* =========================
       ICON
       ========================= */

    .icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 58px;
      height: 58px;

      margin-bottom: 22px;

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          rgba(23, 105, 255, 0.10),
          rgba(47, 206, 44, 0.07)
        );

      border: 1px solid rgba(23, 105, 255, 0.16);

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 10px 30px rgba(23, 105, 255, 0.07);

      position: relative;
      z-index: 1;
    }

    .icon {
      font-size: 25px;

      filter:
        drop-shadow(
          0 2px 5px
          rgba(23, 105, 255, 0.15)
        );
    }

    /* =========================
       TEXT
       ========================= */

    h1 {
      position: relative;
      z-index: 1;

      margin: 0 0 10px;

      color: #101828;

      font-size: 30px;
      line-height: 1.12;

      letter-spacing: -1px;
    }

    .description {
      position: relative;
      z-index: 1;

      margin: 0 0 29px;

      color: #667085;

      font-size: 14px;
      line-height: 1.65;
    }

    /* =========================
       FORM
       ========================= */

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #344054;

      font-size: 13px;
      font-weight: 650;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border-radius: 12px;
      border: 1px solid #d9e1eb;

      background: #ffffff;

      color: #101828;

      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    input::placeholder {
      color: #98a2b3;
    }

    input:hover {
      border-color: #c5cfdb;
    }

    input:focus {
      border-color: #1769ff;

      background: #ffffff;

      box-shadow:
        0 0 0 3px rgba(23, 105, 255, 0.10),
        0 0 20px rgba(23, 105, 255, 0.05);
    }

    input:disabled {
      background: #f2f4f7;
      cursor: not-allowed;
    }

    /* =========================
       PASSWORD HINT
       ========================= */

    .password-hint {
      margin-top: 8px;

      color: #98a2b3;

      font-size: 11px;
      line-height: 1.4;
    }

    /* =========================
       BUTTON
       ========================= */

    button {
      width: 100%;

      margin-top: 5px;

      padding: 14px 16px;

      border: 0;
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #2FCE2C,
          #25b925
        );

      color: #ffffff;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 10px 28px rgba(47, 206, 44, 0.18);

      transition:
        transform 0.15s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.05);

      box-shadow:
        0 13px 35px rgba(47, 206, 44, 0.25);
    }

    button:active:not(:disabled) {
      transform: scale(0.985);
    }

    button:disabled {
      opacity: 0.60;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* =========================
       MESSAGE
       ========================= */

    .message {
      margin-top: 16px;

      padding: 12px 13px;

      border-radius: 11px;

      font-size: 13px;
      line-height: 1.5;

      display: none;

      animation: messageIn 0.25s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error {
      display: block;

      background:
        rgba(217, 45, 32, 0.06);

      border:
        1px solid rgba(217, 45, 32, 0.16);

      color: #b42318;
    }

    .success {
      display: block;

      background:
        rgba(47, 206, 44, 0.08);

      border:
        1px solid rgba(47, 206, 44, 0.20);

      color: #187a17;
    }

    /* =========================
       BACK LINK
       ========================= */

    .back {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 5px;

      margin-top: 23px;

      color: #667085;

      font-size: 13px;

      text-decoration: none;

      transition:
        color 0.2s ease;
    }

    .back:hover {
      color: #1769ff;
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
      margin-top: 20px;

      text-align: center;

      color: #98a2b3;

      font-size: 11px;
      letter-spacing: 0.1px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .card {
        padding: 28px 21px;
        border-radius: 21px;
      }

      h1 {
        font-size: 27px;
      }

      .logo {
        font-size: 25px;
        margin-bottom: 21px;
      }

      .icon-wrapper {
        width: 55px;
        height: 55px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Nexora<span>VPN</span>
    </div>

    <div class="card">

      <div class="icon-wrapper">
        <div class="icon">🔑</div>
      </div>

      <h1>Новый пароль</h1>

      <p class="description">
        Придумайте новый пароль для вашего аккаунта NexoraVPN.
      </p>

      <form id="resetForm">

        <div class="field">

          <label for="password">
            Новый пароль
          </label>

          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              placeholder="Введите новый пароль"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
            >
          </div>

          <div class="password-hint">
            Минимум 8 символов
          </div>

        </div>

        <div class="field">

          <label for="passwordConfirm">
            Повторите пароль
          </label>

          <div class="input-wrapper">
            <input
              type="password"
              id="passwordConfirm"
              placeholder="Повторите новый пароль"
              autocomplete="new-password"
              minlength="8"
              maxlength="128"
              required
            >
          </div>

        </div>

        <button type="submit">
          Изменить пароль
        </button>

        <div
          id="message"
          class="message"
        ></div>

      </form>

      <a
        href="/login.html"
        class="back"
      >
        ← Вернуться ко входу
      </a>

    </div>

    <div class="footer">
      NexoraVPN — Интернет. Без границ.
    </div>

  </div>

<script>
  const form = document.getElementById("resetForm");
  const message = document.getElementById("message");
  const button = form.querySelector("button");

  const params = new URLSearchParams(window.location.search);

  const token = (params.get("token") || "").trim();

  console.log("NEXORA RESET DEBUG:", {
    url: window.location.href,
    tokenExists: Boolean(token),
    tokenLength: token.length
  });

  const validToken = /^[a-f0-9]{64}$/i.test(token);

  if (!validToken) {
    message.className = "message error";

    message.textContent =
      "Диагностика: токен получен = " +
      Boolean(token) +
      ", длина = " +
      token.length +
      ", hex = " +
      /^[a-f0-9]+$/i.test(token);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    message.className = "message";
    message.textContent = "";

    if (!validToken) {
      message.className = "message error";
      message.textContent =
        "Ссылка восстановления недействительна.";
      return;
    }

    const password =
      document.getElementById("password").value;

    const passwordConfirm =
      document.getElementById("passwordConfirm").value;

    if (password.length < 8) {
      message.className = "message error";
      message.textContent =
        "Пароль должен содержать минимум 8 символов.";
      return;
    }

    if (password.length > 128) {
      message.className = "message error";
      message.textContent =
        "Пароль не должен содержать более 128 символов.";
      return;
    }

    if (password !== passwordConfirm) {
      message.className = "message error";
      message.textContent =
        "Пароли не совпадают.";
      return;
    }

    button.disabled = true;
    button.textContent = "Изменяем...";

    try {
      const response = await fetch(
        "/api/reset-password",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: token,
            password: password
          })
        }
      );

      let data = {};

      try {
        data = await response.json();
      } catch {
        data = {};
      }

      if (!response.ok || !data.success) {
        throw new Error(
          data.error ||
          "Не удалось изменить пароль."
        );
      }

      message.className = "message success";
      message.textContent =
        "Пароль успешно изменён. Сейчас вы будете перенаправлены на страницу входа.";

      form
        .querySelectorAll("input, button")
        .forEach((element) => {
          element.disabled = true;
        });

      setTimeout(() => {
        window.location.href = "/login.html";
      }, 2000);

    } catch (error) {
      button.disabled = false;
      button.textContent = "Изменить пароль";

      message.className = "message error";
      message.textContent =
        error.message ||
        "Произошла ошибка.";
    }
  });
</script>

</body>
</html>
